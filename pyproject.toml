[project]
name = "charging-history-demo"
version = "0.1.0"
description = "Isolated synthetic charging-history service for remediation practice"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "python-multipart==0.0.17",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false
exclude-newer = "2026-10-07T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.16.10",
]
