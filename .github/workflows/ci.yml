name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: uv run --locked ruff check . && uv run --locked ruff format --check .
          - name: Tests
            command: uv run --locked pytest --junitxml=artifacts/tests.xml
          - name: Application smoke
            command: uv run --locked python -m scripts.smoke
          - name: Dependency audit
            command: uv run --locked python -m scripts.audit --output-dir artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: Install pinned package manager
        run: python -m pip install uv==0.9.28
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run check
        run: |
          mkdir -p artifacts
          ${{ matrix.command }}
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}-reports
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
